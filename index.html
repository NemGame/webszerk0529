<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            body {
                font-family: Helvetica, sans-serif;
                background-color: black;
                color: white;
            }
            main {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                div {
                    font-weight: bold;
                    font-size: large;
                    position: relative;
                    width: 50%;
                    display: grid;
                    place-items: center;
                    cursor: pointer;
                    transition: background-color 0.2s;
                    &:hover {
                        background-color: rgb(40, 40, 40);
                    }
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div onclick="window.open('tagok/', '_self')">
                Tagok (1.)
            </div>
            <div onclick="window.open('2.feladat/', '_self')">
                Tankolás (2.)
            </div>
        </main>
    </body>
</html>
